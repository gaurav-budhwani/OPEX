site_name: OPEX Language & Compiler
site_description: Documentation for OPEX (Optimized Processing Engine for eXecution), a domain-specific compiled language for algorithms and computer vision.
site_author: Gaurav Budhwani, John Twipraham Debbarma, Harshit
site_url: https://gaurav-budhwani.github.io/OPEX/
repo_url: https://github.com/gaurav-budhwani/OPEX
repo_name: gaurav-budhwani/OPEX

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark mode (Primary default for modern dev aesthetic)
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gaurav-budhwani/OPEX
      name: GitHub Repository
    - icon: fontawesome/solid/globe
      link: https://gaurav-budhwani.github.io/
      name: Gaurav Budhwani Portfolio

nav:
  - Overview: index.md
  - Getting Started:
      - Installation & Build: getting-started/installation.md
      - Hello World: getting-started/hello-world.md
  - Language Reference:
      - Types & Variables: language-guide/types-and-variables.md
      - Control Flow: language-guide/control-flow.md
      - Functions & Structs: language-guide/functions-and-structs.md
      - Input & Output: language-guide/io.md
  - Computer Vision:
      - CV Types: computer-vision/cv-types.md
      - Convolution & Pipeline: computer-vision/operators.md
      - Built-in Operations: computer-vision/builtins.md
  - Compiler Internals:
      - Architecture Pipeline: compiler-internals/pipeline.md
      - Lexical Analysis (Flex): compiler-internals/lexer.md
      - Syntax & LALR(1) Parsing: compiler-internals/parser.md
      - Intermediate Code (3AC): compiler-internals/intermediate-code.md
      - Native Code Generation: compiler-internals/codegen.md
  - Examples & Benchmarks:
      - Edge Detection: examples/edge-detection.md
      - Sorting & Searching: examples/sorting-and-searching.md
      - Recursive Algorithms: examples/recursion.md
      - Data Structures: examples/data-structures.md
  - Academic Reports: reports/reports.md
